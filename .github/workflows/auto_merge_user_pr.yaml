name: Auto Merge PRs from Trusted User

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_merge:
    # 348240357 = ny-ci-writer[bot], the GitHub App ny-react-native's asset sync opens PRs with
    if: github.event.pull_request.user.id == 348240357 && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto
